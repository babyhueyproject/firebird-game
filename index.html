<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Firebird — Survival Flight</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160e18;font-family:system-ui,Arial,sans-serif}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,56.22vh,529px);height:min(100vh,177.7vw,941px);overflow:hidden;background:#9c3043;box-shadow:0 0 45px #0009}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:2px 3px 0 #53202a;font-weight:1000}.score{position:absolute;top:22px;width:100%;text-align:center;font-size:clamp(32px,8vw,49px);letter-spacing:2px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#260d2c66;text-align:center;color:white}.panel{width:min(100%,360px);padding:24px 22px;border:3px solid #ffc14d;border-radius:18px;background:linear-gradient(155deg,#81253cf2,#32162ef5);box-shadow:0 10px 0 #401321,0 20px 45px #190b19aa}h1{font-size:clamp(32px,8vw,46px);line-height:1;margin:0;color:#ffdc78;text-shadow:3px 4px #702b2d}.sub{font-size:13px;line-height:1.5;color:#ffe8c2;margin:12px 0 18px}button{border:0;border-radius:12px;padding:13px 24px;background:linear-gradient(#ffe36c,#ff9f35);color:#56212a;font-weight:1000;font-size:17px;box-shadow:0 5px #a8482b;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px #a8482b}.share-btn{margin-top:13px;background:linear-gradient(#ffcf68,#ff8738);font-size:13px;padding:12px 16px;width:100%;box-shadow:0 4px #a8482b}.hint{font-size:11px;color:#ffdcae;margin-top:15px}.hidden{display:none!important}.laugh{height:215px;width:100%;object-fit:contain;object-position:center bottom;display:block;margin:-12px auto 4px;filter:drop-shadow(0 5px 0 #24121c)}.result{font-size:17px;margin:9px 0 16px;color:#fff1d5}.result b{display:block;font-size:38px;color:#ffdb76}@media(max-height:680px){.laugh{height:145px}.panel{padding:15px}.sub{margin:6px 0 10px}}
</style></head><body><div class="shell"><canvas id="game" width="529" height="941"></canvas>
<audio id="bgm" src="audio/background-music.mp3" preload="auto" loop></audio>
<audio id="flySfx" src="audio/fly-tap.mp3" preload="auto"></audio>
<audio id="gameOverSfx" src="audio/game-over.mp3" preload="auto"></audio><div class="hud"><div class="score" id="score">0</div></div>
<div class="overlay" id="start"><div class="panel"><h1>FIREBIRD</h1><div style="font-weight:900;letter-spacing:4px;color:#ffad4a;margin-top:7px">SURVIVAL FLIGHT</div><p class="sub">Terbang melewati batang pohon yang terbakar. Hindari kobaran api dan raih skor tertinggi!</p><button id="play">MULAI TERBANG</button><div class="hint">SPACE / ↑ / KLIK / TAP untuk mengepakkan sayap</div></div></div>
<div class="overlay hidden" id="over"><div class="panel"><img class="laugh" id="laugh" alt="Karakter bapak tertawa"><h1>GAME OVER!</h1><div class="result">Skor kamu <b id="finalScore">0</b><span id="bestLine">Rekor terbaik: 0</span></div><button id="again">COBA LAGI</button><button id="shareScore" class="share-btn">BAGIKAN SKORMU</button><div class="hint">Bagikan hasil permainanmu ke Media Sosial</div></div></div></div>
<script>
(async function(){
const C=document.getElementById('game'),ctx=C.getContext('2d'),W=529,H=941;
const startEl=document.getElementById('start'),overEl=document.getElementById('over'),scoreEl=document.getElementById('score');
const bgm=document.getElementById('bgm'),flySfx=document.getElementById('flySfx'),gameOverSfx=document.getElementById('gameOverSfx');
bgm.volume=0.42;flySfx.volume=0.72;gameOverSfx.volume=0.85;
function playSfx(audio){try{audio.pause();audio.currentTime=0;const p=audio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function startMusic(){try{bgm.currentTime=0;const p=bgm.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function stopMusic(){try{bgm.pause();bgm.currentTime=0;}catch(e){}}

window.addEventListener('error',e=>{console.error('Firebird runtime error:',e.message);});
function load(src){return new Promise(r=>{let i=new Image(),done=false;const finish=()=>{if(!done){done=true;r(i)}};i.onload=finish;i.onerror=finish;i.src=src;if(i.complete)finish();setTimeout(finish,8000)})}
document.getElementById('laugh').src='firebird_assets/gameover-character.png';
function readBest(){try{return +(window.localStorage.getItem('firebirdBest')||0)}catch(e){return 0}}
function writeBest(v){try{window.localStorage.setItem('firebirdBest',String(v))}catch(e){}}
let state='ready',bird,logs=[],score=0,frame=0,birdAnimStart=-1,speed=3.1,best=readBest(),embers=[];
const rand=(a,b)=>Math.random()*(b-a)+a;
function reset(){bird={x:158,y:430,vy:0,rot:0};logs=[];score=0;frame=0;birdAnimStart=-1;speed=3.1;embers=[];scoreEl.textContent='0';for(let i=0;i<3;i++)logs.push({x:620+i*285,gapY:rand(370,550),gap:285,passed:false})}
function start(){reset();state='playing';startMusic();document.querySelector('.shell').classList.add('playing');startEl.classList.add('hidden');overEl.classList.add('hidden')}
function flap(){if(state!=='playing'){start();bird.vy=-7.3}else bird.vy=-7.2;playSfx(flySfx);birdAnimStart=frame}
document.getElementById('play').onclick=flap;document.getElementById('again').onclick=flap;
C.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap()}});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#922c48');g.addColorStop(.5,'#ed4a35');g.addColorStop(1,'#692039');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let j=0;j<3;j++){let x=((j*245-frame*.22)%(W+230)+W+230)%(W+230)-120,y=190+j*150;let c=j===0?'#f65a43':'#b33a43';rect(x,y,130,24,c);rect(x+18,y-13,70,18,c);rect(x+52,y-24,34,14,c);rect(x+100,y+12,45,12,c)}
for(let i=0;i<10;i++){let x=((i*75-frame*.42)%(W+80)+W+80)%(W+80)-40,b=820+(i%3)*10;rect(x+12,b-115,12,115,'#7d2939');rect(x-5,b-85,20,8,'#7d2939');rect(x+22,b-70,28,8,'#7d2939');if(i%2===0){rect(x-8,b-20,8,20,'#ff5a16');rect(x-3,b-38,10,18,'#ff9b20')}}
rect(0,842,W,99,'#34202b');rect(0,842,W,17,'#182c19');rect(0,847,W,12,'#75a51c');rect(0,859,W,13,'#a2c52b');for(let x=0;x<W;x+=22){rect(x,840+(x%3)*2,4,7,'#c5d83c');rect(x+9,859,7,5,'#4d6d1b')}rect(0,883,W,58,'#8c3429');for(let x=0;x<W;x+=48){rect(x,890,26,12,'#a9432b');rect(x+22,916,30,13,'#682832')}}

function spawnEmber(x,y,dir= -1){
  embers.push({x:x+rand(-58,58),y:y+rand(-5,8),vx:rand(-1.5,1.5),vy:dir*rand(1.6,4.8),life:rand(25,58),size:rand(2,5),h:rand(22,48)});
}
function drawTrunk(x,y,w,h,edge,flameDir){
  if(h<=0)return;
  // dark silhouette and chunky bark body
  ctx.fillStyle='#301923';ctx.fillRect(x-4,y,w+8,h);
  ctx.fillStyle='#713027';ctx.fillRect(x+3,y,w-6,h);
  ctx.fillStyle='#9a402b';ctx.fillRect(x+12,y,w-26,h);
  ctx.fillStyle='#b34b2c';ctx.fillRect(x+22,y,w-48,h);
  ctx.fillStyle='#69272a';ctx.fillRect(x+w-27,y,w-9>0?15:8,h);
  // scorched vertical bark slabs
  for(let k=0;k<8;k++){
    const xx=x+10+((k*37+13)% (w-28));
    const yy=y+((k*67+frame*0.03)%(Math.max(1,h+35)))-12;
    const hh=18+(k%4)*13;
    ctx.fillStyle=k%2?'#55232a':'#69282a';
    ctx.fillRect(xx,Math.max(y,yy),5,Math.min(hh,Math.max(0,y+h-Math.max(y,yy))));
    ctx.fillStyle='#c45a31';ctx.fillRect(xx+6,Math.max(y,yy+5),3,Math.min(9,Math.max(0,y+h-Math.max(y,yy+5))));
  }
  // broken, irregular bark edges
  ctx.fillStyle='#351c24';
  for(let k=0;k<9;k++){let xx=x+8+k*16;ctx.fillRect(xx,y+(k%2?0:3),5,Math.min(h,10+(k%3)*5));ctx.fillRect(xx+7,Math.max(y,y+h-13-(k%3)*5),6,Math.min(h,13+(k%3)*5))}
  // heavy blackened rim at the opening
  const ry=flameDir===1?y+h-10:y;
  ctx.fillStyle='#291820';ctx.fillRect(x-5,ry,w+10,13);
  ctx.fillStyle='#b34b2b';ctx.fillRect(x+3,ry+ (flameDir===1?0:5),w-6,5);
  // cracks
  ctx.fillStyle='#3c1d25';
  for(let k=0;k<5;k++){let xx=x+25+k*24, yy=y+Math.min(h-2,30+(k*41)%(Math.max(35,h)));ctx.fillRect(xx,yy,4,Math.min(34,Math.max(0,y+h-yy)))}
}
function drawFlameLine(x,edge,w,dir,scale=1){
  // Chunky 8-bit fire: every flame is built from hard-edged square pixels.
  ctx.save();
  const cell=6;
  const base=Math.round(edge/cell)*cell;
  ctx.fillStyle='#8f211f';
  ctx.fillRect(x+3,base,w-6,cell*2);
  ctx.fillStyle='#f04413';
  ctx.fillRect(x+6,base+(dir===1?-cell:0),w-12,cell);
  // Separate tongues with stepped silhouettes and quantized frame changes.
  const count=Math.floor((w-12)/(cell*5));
  for(let i=0;i<count;i++){
    const phase=Math.floor(frame/5);
    const pulse=((i*7+phase*3)%7);
    const heightCells=5+((i*5+phase*2)%5)+Math.floor(pulse/2);
    const height=Math.round(heightCells*scale);
    const tongueX=x+8+i*cell*5;
    for(let row=0;row<height;row++){
      const t=row/Math.max(1,height-1);
      // Wider at the base, narrowing in stair steps toward the tip.
      const half=Math.max(0,Math.ceil((1-t)*2.5));
      const widthCells=half*2+1;
      const offset=(5-widthCells)*cell/2;
      const yy=base+dir*(row*cell+cell);
      // Outer ember-red pixel edge.
      ctx.fillStyle='#d92d16';
      ctx.fillRect(tongueX+offset-cell,yy,widthCells*cell+cell*2,cell);
      // Main orange body.
      ctx.fillStyle='#ff6417';
      ctx.fillRect(tongueX+offset,yy,widthCells*cell,cell);
      // Golden inner pixels, stopping before the flame tip.
      if(row<height*.68){
        ctx.fillStyle='#ffad20';
        const innerW=Math.max(cell,widthCells*cell-cell*2);
        ctx.fillRect(tongueX+offset+cell,yy,innerW,cell);
      }
      if(row<height*.32){
        ctx.fillStyle='#ffe34b';
        ctx.fillRect(tongueX+offset+cell*2,yy,Math.max(cell,widthCells*cell-cell*4),cell);
      }
    }
    // Small pixel sparks at selected tips.
    if((i+phase)%3===0){
      ctx.fillStyle='#ffd947';
      ctx.fillRect(tongueX+cell,base+dir*(height*cell+cell*2),cell,cell);
    }
  }
  // Hot pixel strip along the burning rim.
  ctx.fillStyle='#ffdc38';
  ctx.fillRect(x+12,base+(dir===1?-cell:0),w-24,cell);
  ctx.fillStyle='#fff17a';
  ctx.fillRect(x+30,base+(dir===1?-cell:0),w-60,Math.max(2,cell/2));
  ctx.restore();
  if(Math.random()<.65)spawnEmber(x+w/2,base,dir);
}
function drawLogs(){
  for(const p of logs){
    const topH=p.gapY-p.gap/2,botY=p.gapY+p.gap/2;
    // Upper trunk hangs from above; its flames lick upward with the same shape as the lower flames.
    drawTrunk(p.x,0,155,topH,topH,1);
    drawFlameLine(p.x,topH+2,155,-1,1.18);
    // Lower trunk grows from the ground; flames point up into the gap.
    drawTrunk(p.x,botY,155,842-botY,botY,-1);
    drawFlameLine(p.x,botY+2,155,-1,1.18);
  }
}
function drawEmbers(){ctx.save();ctx.globalCompositeOperation='lighter';for(let e of embers){e.x+=e.vx;e.y+=e.vy;e.vy+=.035;e.life--;ctx.globalAlpha=Math.max(0,e.life/55);ctx.fillStyle=e.h<35?'#ffec52':'#ff5b12';ctx.fillRect(e.x,e.y,e.size,e.size*1.5)}ctx.restore();embers=embers.filter(e=>e.life>0)}

const birdFrames=await Promise.all([load('firebird_assets/bird-fly-1.png'),load('firebird_assets/bird-fly-2.png'),load('firebird_assets/bird-fly-3.png'),load('firebird_assets/bird-fly-4.png')]);
function drawBird(){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  // Keep the first sprite as the resting pose. Only play the remaining frames after a tap.
  let pose=0;
  if(birdAnimStart>=0){
    const elapsed=frame-birdAnimStart;
    const step=Math.floor(elapsed/4);
    if(step<birdFrames.length-1)pose=step+1;
    else birdAnimStart=-1;
  }
  const f=birdFrames[pose];
  ctx.imageSmoothingEnabled=false;ctx.drawImage(f,-78,-58,156,116);ctx.restore();
}
function end(){if(state!=='playing')return;state='over';stopMusic();playSfx(gameOverSfx);document.querySelector('.shell').classList.remove('playing');document.getElementById('finalScore').textContent=score;best=Math.max(best,score);writeBest(best);document.getElementById('bestLine').textContent='Rekor terbaik: '+best;overEl.classList.remove('hidden')}
function tick(){frame++;bg();if(state==='playing'){bird.vy+=.34;bird.y+=bird.vy;bird.rot=Math.min(.65,Math.max(-.5,bird.vy*.065));logs.forEach(p=>{p.x-=speed;if(!p.passed&&p.x+155<bird.x){p.passed=true;score++;scoreEl.textContent=score;if(score%5===0)speed+=.14}});if(logs[0].x<-170){let last=logs[logs.length-1];logs.shift();logs.push({x:last.x+285,gapY:rand(370,550),gap:Math.max(235,285-Math.min(score,10)*4),passed:false})}drawLogs();drawBird();drawEmbers();if(bird.y>824||bird.y<5)end();for(let p of logs){let hitX=bird.x+48>p.x&&bird.x-48<p.x+155;if(hitX&&(bird.y-29<p.gapY-p.gap/2+3||bird.y+29>p.gapY+p.gap/2-3))end()}}
else{bird.y=430+Math.sin(frame*.06)*8;bird.rot=Math.sin(frame*.04)*.04;drawBird();drawEmbers()}requestAnimationFrame(tick)}

  const w=1080,h=1920,card=document.createElement('canvas');card.width=w;card.height=h;
